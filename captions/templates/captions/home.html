<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caption Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Caption Generator</title>
</head>
<body>
</body>
    <div class="container mt-5" style="max-width: 600px;">
    <h1 class="mb-4">Caption Generator</h1>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
        <label class="form-label" for="product_name">Product Name:</label>
        <input type="text" id="product_name" name="product_name" class="form-control" required>
        </div>

        <div class="mb-3">
        <label class="form-label" for="tone">Tone:</label>
        <select id="tone" name="tone" class="form-select">
            <option value="excited">Excited</option>
            <option value="professional">Professional</option>
            <option value="neutral">Neutral</option>
        </select>
        </div>

        <div class="mb-3">
        <label class="form-label" for="platform">Platform:</label>
        <select id="platform" name="platform" class="form-select">
            <option value="instagram">Instagram</option>
            <option value="tiktok">TikTok</option>
            <option value="facebook">Facebook</option>
        </select>
        </div>

        <div class="mb-3">
        <label class="form-label" for="feature">Feature:</label>
        <input type="text" id="feature" name="feature" class="form-control" optional>
        </div>

        <div class="mb-3">
        <label class="form-label" for="cta_type">CTA Type:</label>
        <select id="cta_type" name="cta_type" class="form-select">
            <option value="Link In Bio">Link in Bio</option>
            <option value="DM To Order">DM to Order</option>
            <option value="Comment Below">Comment Below</option>
        </select>
        </div>

        <button type="submit" class="btn btn-primary">Generate Caption</button>
    
    </form>


    {% if generated_caption %}
        <div class="mt-4">
        <h2>Your Caption:</h2>
        <p class="mb-0">{{ generated_caption }}</p>
        </div>
    {% endif %}

    </div>
</body>
</html>
